server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: MyEcommerce
  # mysql
  datasource:
    #    url: jdbc:mysql://localhost:3306/ecommerce_db
    url: jdbc:mysql://mysql:3306/ecommerce_db
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
  # mail
  mail:
    protocol: smtp
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
    nickname: ${MAIL_NICKNAME:MyEcommerce}
  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  # Thymeleaf
  thymeleaf:
    cache: false
# MySQL
logging.level.org.hibernate.SQL: debug

app:
  product-images:
    localize-on-startup: true
    upload-root: upload/
    storage-path: upload/products
    public-path: /upload/products
