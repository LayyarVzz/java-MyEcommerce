server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: MyEcommerce
  # Example MySQL configuration. Override these values with environment variables in real deployments.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    # Docker Compose example:
    # DB_URL=jdbc:mysql://mysql:3306/ecommerce_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Example mail configuration. Do not commit real mailbox passwords or authorization codes.
  mail:
    protocol: ${MAIL_PROTOCOL:smtps}
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.socketFactory.class]": javax.net.ssl.SSLSocketFactory
      "[mail.smtp.socketFactory.fallback]": false
      "[mail.smtp.socketFactory.port]": ${MAIL_PORT:465}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
    nickname: ${MAIL_NICKNAME:MyEcommerce}
  # JPA
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  # Thymeleaf
  thymeleaf:
    cache: false
# MySQL
logging.level.org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:debug}

app:
  product-images:
    localize-on-startup: ${PRODUCT_IMAGES_LOCALIZE_ON_STARTUP:true}
    upload-root: ${PRODUCT_IMAGES_UPLOAD_ROOT:upload/}
    storage-path: ${PRODUCT_IMAGES_STORAGE_PATH:upload/products}
    public-path: ${PRODUCT_IMAGES_PUBLIC_PATH:/upload/products}
