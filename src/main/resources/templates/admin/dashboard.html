<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/admin-shell :: head}"></th:block>
    <title>管理员控制台 - MyEcommerce</title>
</head>
<body>
<th:block th:replace="~{fragments/admin-shell :: navbar(activePage='admin-dashboard')}"></th:block>

<div class="page-header">
    <div class="container">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
            <div>
                <h1 class="mb-1">管理员控制台</h1>
                <p class="text-muted mb-0">系统、用户、销售账号和经营数据集中管理</p>
            </div>
            <span class="badge text-bg-dark px-3 py-2">ADMIN</span>
        </div>
    </div>
</div>

<main class="container mb-5">
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card role-stat h-100">
                <div class="card-body">
                    <div class="text-muted small">用户总数</div>
                    <div class="display-6 fw-bold" th:text="${totalUsers}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card role-stat h-100">
                <div class="card-body">
                    <div class="text-muted small">订单总数</div>
                    <div class="display-6 fw-bold" th:text="${totalOrders}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card role-stat h-100">
                <div class="card-body">
                    <div class="text-muted small">销售中商品</div>
                    <div class="display-6 fw-bold" th:text="${activeProducts}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card role-stat h-100">
                <div class="card-body">
                    <div class="text-muted small">活动日志</div>
                    <div class="display-6 fw-bold" th:text="${totalActivities}">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header">近 30 天经营摘要</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-sm-4">
                            <div class="p-3 bg-light rounded-2">
                                <div class="text-muted small">有效订单</div>
                                <strong th:text="${reportData.totalOrders}">0</strong>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="p-3 bg-light rounded-2">
                                <div class="text-muted small">销售收入</div>
                                <strong th:text="'¥' + ${#numbers.formatDecimal(reportData.totalRevenue, 1, 2)}">¥0.00</strong>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="p-3 bg-light rounded-2">
                                <div class="text-muted small">售出商品</div>
                                <strong th:text="${reportData.totalProductsSold}">0</strong>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a href="/admin/reports" class="btn btn-primary"><i class="bi bi-bar-chart-line me-1"></i>查看完整报表</a>
                        <a href="/admin/customers" class="btn btn-outline-secondary"><i class="bi bi-people me-1"></i>管理用户与销售</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header">系统入口</div>
                <div class="list-group list-group-flush">
                    <a class="list-group-item list-group-item-action" href="/admin/products"><i class="bi bi-box-seam me-2"></i>商品管理</a>
                    <a class="list-group-item list-group-item-action" href="/admin/orders"><i class="bi bi-list-check me-2"></i>订单管理</a>
                    <a class="list-group-item list-group-item-action" href="/admin/activities"><i class="bi bi-clock-history me-2"></i>数据日志</a>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
