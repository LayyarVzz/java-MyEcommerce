<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navbar :: head}"></th:block>
    <title th:text="${product.name + ' - 商品详情'}">商品详情 - 电商网站</title>
</head>
<body class="storefront-page product-detail-page">

<th:block th:replace="~{fragments/navbar :: navbar(activePage='products')}"></th:block>

<main class="container product-detail-shell" th:with="available=${product.stock != null and product.stock > 0 and !product.discontinued}">
    <nav class="mb-4" aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a class="product-link" th:href="@{/products}">商品列表</a></li>
            <li class="breadcrumb-item">
                <a class="product-link" th:href="@{/products(category=${product.category})}" th:text="${product.category ?: '综合商品'}">综合商品</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">商品名称</li>
        </ol>
    </nav>

    <section class="product-detail-hero">
        <div class="product-gallery">
            <img th:src="${product.imageUrl ?: '/upload/default.png'}"
                 onerror="this.onerror=null;this.src='/upload/default.png';"
                 th:alt="${product.name}">
        </div>

        <article class="product-detail-panel">
            <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
                <span class="badge bg-light text-dark border" th:text="${product.category ?: '综合商品'}">综合商品</span>
                <span th:if="${available}" class="badge bg-success">现货</span>
                <span th:unless="${available}" class="badge bg-secondary">暂不可购</span>
            </div>

            <h1 class="mb-3" th:text="${product.name}">商品名称</h1>
            <p class="detail-description mb-4" th:text="${product.description ?: '暂无详细描述。'}">商品描述</p>

            <div class="product-price display-5 mb-4" th:text="'¥' + ${product.price}">¥0.00</div>

            <div class="detail-spec-grid mb-4">
                <div class="detail-spec">
                    <span>商品编号</span>
                    <strong th:text="${'#' + product.id}">#0</strong>
                </div>
                <div class="detail-spec">
                    <span>库存</span>
                    <strong th:text="${product.stock != null ? product.stock : 0}">0</strong>
                </div>
                <div class="detail-spec">
                    <span>分类</span>
                    <strong th:text="${product.category ?: '综合商品'}">综合商品</strong>
                </div>
            </div>

            <form th:if="${available and #authorization.expression('hasRole(''USER'')')}"
                  th:action="@{/cart/add}"
                  th:data-ajax-url="@{/cart/add-ajax}"
                  method="post"
                  class="detail-purchase-form add-to-cart-form">
                <input type="hidden" name="productId" th:value="${product.id}">
                <div class="input-group">
                    <input type="number" name="quantity" class="form-control" value="1" min="1"
                           th:max="${product.stock != null ? product.stock : 1}">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-cart-plus me-1"></i>加入购物车
                    </button>
                </div>
            </form>

            <a th:if="${available and #authorization.expression('isAnonymous()')}" href="/login" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>登录后购买
            </a>

            <div th:unless="${available}" class="alert alert-warning mb-0">
                <i class="bi bi-exclamation-triangle me-2"></i>该商品当前库存不足或已下架，暂时无法加入购物车。
            </div>
        </article>
    </section>

    <section class="related-section" th:if="${relatedProducts != null and !#lists.isEmpty(relatedProducts)}">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h2 class="h4 mb-1">同类精选</h2>
                <p class="text-muted mb-0">继续看看这个分类下的其他选择</p>
            </div>
            <a th:href="@{/products(category=${product.category})}" class="btn btn-outline-primary btn-sm">
                查看分类
            </a>
        </div>
        <div class="product-grid">
            <div th:each="related : ${relatedProducts}" th:if="${related.id != product.id}" class="product-grid-item">
                <div class="card product-card h-100">
                    <a class="card-image-wrapper" th:href="@{/products/{id}(id=${related.id})}">
                        <img th:src="${related.imageUrl ?: '/upload/default.png'}"
                             class="card-img-top"
                             onerror="this.onerror=null;this.src='/upload/default.png';"
                             th:alt="${related.name}">
                    </a>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">
                            <a th:href="@{/products/{id}(id=${related.id})}" th:text="${related.name}">相关商品</a>
                        </h5>
                        <p class="card-text" th:text="${related.description}">商品描述</p>
                        <div class="mt-auto">
                            <div class="price-badge" th:text="'¥' + ${related.price}">¥0.00</div>
                            <a th:href="@{/products/{id}(id=${related.id})}" class="btn btn-outline-primary w-100">
                                <i class="bi bi-eye me-1"></i>查看详情
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="cartToast" class="toast cart-toast align-items-center text-bg-success" role="status" aria-live="polite" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">已加入购物车</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="关闭"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toastEl = document.getElementById('cartToast');
        const toastBody = toastEl ? toastEl.querySelector('.toast-body') : null;
        const toast = toastEl && window.bootstrap ? new bootstrap.Toast(toastEl, { delay: 1800 }) : null;

        const showCartMessage = (message, success = true) => {
            if (!toastEl || !toastBody || !toast) {
                return;
            }
            toastBody.textContent = message;
            toastEl.classList.toggle('text-bg-success', success);
            toastEl.classList.toggle('text-bg-danger', !success);
            toast.show();
        };

        document.querySelectorAll('.add-to-cart-form').forEach((form) => {
            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                const button = form.querySelector('button[type="submit"]');
                const originalButtonHtml = button ? button.innerHTML : '';

                if (button) {
                    button.disabled = true;
                    button.innerHTML = '<span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>加入中';
                }

                try {
                    const response = await fetch(form.dataset.ajaxUrl || form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });
                    const contentType = response.headers.get('content-type') || '';
                    if (!contentType.includes('application/json')) {
                        throw new Error('登录状态已失效，请重新登录');
                    }
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok || data.success === false) {
                        throw new Error(data.message || '加入购物车失败');
                    }
                    showCartMessage(data.message || '已加入购物车');
                } catch (error) {
                    showCartMessage(error.message || '加入购物车失败', false);
                } finally {
                    if (button) {
                        button.disabled = false;
                        button.innerHTML = originalButtonHtml;
                    }
                }
            });
        });
    });
</script>
</body>
</html>
