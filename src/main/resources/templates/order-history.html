<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navbar :: head}"></th:block>
    <title>订单历史 - 电商网站</title>
    <style>
        .order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
    </style>
</head>
<body class="storefront-page order-history-page">

<th:block th:replace="~{fragments/navbar :: navbar(activePage='orders')}"></th:block>

<div class="page-header">
    <div class="container">
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-receipt fs-1"></i>
            <div>
                <h1 class="mb-1">订单历史</h1>
                <p class="mb-0">查看订单状态、金额和后续操作</p>
            </div>
        </div>
    </div>
</div>

<main class="container mb-5">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}">操作成功</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}">操作失败</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-orders mb-4">
        <i class="bi bi-inbox fs-1 text-muted"></i>
        <h4 class="mt-3">暂无订单记录</h4>
        <p class="text-muted mb-3">您还没有任何订单，先去看看新品陈列吧。</p>
        <a href="/products" class="btn btn-primary">
            <i class="bi bi-cart-plus me-1"></i>去购物
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}" class="table-responsive-lg">
        <table class="table table-hover">
            <thead>
            <tr>
                <th><i class="bi bi-123 me-1"></i>订单号</th>
                <th><i class="bi bi-calendar me-1"></i>下单时间</th>
                <th><i class="bi bi-currency-yen me-1"></i>总金额</th>
                <th><i class="bi bi-info-circle me-1"></i>状态</th>
                <th><i class="bi bi-gear me-1"></i>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td><strong th:text="${order.id}">1</strong></td>
                <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2025-12-26 12:00</td>
                <td><strong th:text="'¥' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">¥0.00</strong></td>
                <td>
                    <span th:switch="${order.status}">
                        <span th:case="'待处理'" class="badge bg-warning text-dark">待处理</span>
                        <span th:case="'已确认'" class="badge bg-info text-dark">已确认</span>
                        <span th:case="'已发货'" class="badge bg-primary">已发货</span>
                        <span th:case="'已送达'" class="badge bg-success">已送达</span>
                        <span th:case="'已取消'" class="badge bg-danger">已取消</span>
                        <span th:case="*" class="badge bg-secondary" th:text="${order.status}">状态</span>
                    </span>
                </td>
                <td>
                    <div class="order-actions">
                        <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-primary btn-sm">
                            <i class="bi bi-eye me-1"></i>查看详情
                        </a>
                        <form th:if="${order.status == '待处理'}"
                              th:action="@{/orders/{id}/cancel(id=${order.id})}"
                              method="post"
                              onsubmit="return confirm('确认取消该订单吗？订单金额将退回余额。')">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-x-circle me-1"></i>取消订单
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
