<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/sales-shell :: head}"></th:block>
    <title>销售工作台 - MyEcommerce</title>
</head>
<body>
<th:block th:replace="~{fragments/sales-shell :: navbar(activePage='sales-dashboard')}"></th:block>

<div class="page-header">
    <div class="container">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
            <div>
                <h1 class="mb-1">销售工作台</h1>
                <p class="text-muted mb-0">处理订单、维护商品、跟进库存和销售状态</p>
            </div>
            <span class="badge text-bg-success px-3 py-2">SALES</span>
        </div>
    </div>
</div>

<main class="container mb-5">
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card role-stat h-100">
                <div class="card-body">
                    <div class="text-muted small">待处理订单</div>
                    <div class="display-6 fw-bold" th:text="${pendingOrders}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card role-stat h-100">
                <div class="card-body">
                    <div class="text-muted small">订单总数</div>
                    <div class="display-6 fw-bold" th:text="${totalOrders}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card role-stat h-100">
                <div class="card-body">
                    <div class="text-muted small">商品数量</div>
                    <div class="display-6 fw-bold" th:text="${totalProducts}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card role-stat h-100">
                <div class="card-body">
                    <div class="text-muted small">低库存</div>
                    <div class="display-6 fw-bold" th:text="${lowStockProducts}">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header">近 30 天销售概览</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-sm-4">
                            <div class="p-3 bg-light rounded-2">
                                <div class="text-muted small">有效订单</div>
                                <strong th:text="${reportData.totalOrders}">0</strong>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="p-3 bg-light rounded-2">
                                <div class="text-muted small">销售额</div>
                                <strong th:text="'¥' + ${#numbers.formatDecimal(reportData.totalRevenue, 1, 2)}">¥0.00</strong>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="p-3 bg-light rounded-2">
                                <div class="text-muted small">未来 7 天预测</div>
                                <strong th:text="'¥' + ${#numbers.formatDecimal(reportData.forecastRevenue, 1, 2)}">¥0.00</strong>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a href="/sales/orders" class="btn btn-primary"><i class="bi bi-truck me-1"></i>处理订单</a>
                        <a href="/sales/products" class="btn btn-outline-secondary"><i class="bi bi-box-seam me-1"></i>维护商品</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header">销售入口</div>
                <div class="list-group list-group-flush">
                    <a class="list-group-item list-group-item-action" href="/sales/orders"><i class="bi bi-truck me-2"></i>订单处理</a>
                    <a class="list-group-item list-group-item-action" href="/sales/activities"><i class="bi bi-activity me-2"></i>操作日志</a>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
