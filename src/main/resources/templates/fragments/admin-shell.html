<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/backoffice.css}">
    <link rel="stylesheet" th:href="@{/css/confirm-dialog.css}">
    <script defer th:src="@{/js/platform-confirm.js}"></script>
    <style>
        :root {
            --admin-primary: #263044;
            --admin-accent: #c2410c;
            --admin-muted: #64748b;
            --admin-surface: #ffffff;
            --admin-bg: #f3f4f6;
        }
        body {
            background: var(--admin-bg);
            color: #172033;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .admin-navbar {
            background: var(--admin-primary);
            border-bottom: 4px solid var(--admin-accent);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
        }
        .admin-navbar .navbar-brand {
            font-weight: 700;
            letter-spacing: 0;
        }
        .admin-navbar .nav-link {
            color: rgba(255, 255, 255, 0.78);
            border-radius: 8px;
            padding: 0.55rem 0.75rem;
        }
        .admin-navbar .nav-link:hover,
        .admin-navbar .nav-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }
        .workspace-badge {
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 8px;
            color: #fff;
            padding: 0.45rem 0.65rem;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }
        .page-header {
            background: var(--admin-surface);
            border-bottom: 1px solid #e2e8f0;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
        }
        .card-header {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 700;
        }
        .table thead th {
            background: var(--admin-primary) !important;
            color: #fff !important;
            border: none;
        }
        .btn-primary {
            background: var(--admin-primary);
            border-color: var(--admin-primary);
        }
        .btn-primary:hover {
            background: #111827;
            border-color: #111827;
        }
        .role-stat {
            border-left: 4px solid var(--admin-accent);
        }
    </style>
</head>
<body>
<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-dark admin-navbar sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/admin/dashboard">
            <i class="bi bi-shield-lock me-2"></i>管理员控制台
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'admin-dashboard' ? 'active' : ''}" href="/admin/dashboard">
                        <i class="bi bi-speedometer2 me-1"></i>总览
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'admin-customers' ? 'active' : ''}" href="/admin/customers">
                        <i class="bi bi-people me-1"></i>用户与销售
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'admin-reports' ? 'active' : ''}" href="/admin/reports">
                        <i class="bi bi-bar-chart-line me-1"></i>报表
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'admin-activities' ? 'active' : ''}" href="/admin/activities">
                        <i class="bi bi-clock-history me-1"></i>日志
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link text-light" href="/products"><i class="bi bi-shop me-1"></i>商城</a>
                <span class="workspace-badge"><i class="bi bi-person-gear"></i><span th:text="${username}">admin</span></span>
                <a href="/logout" class="text-light text-decoration-none"><i class="bi bi-box-arrow-right"></i></a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
