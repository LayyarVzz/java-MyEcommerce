<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/backoffice.css}">
    <link rel="stylesheet" th:href="@{/css/confirm-dialog.css}">
    <script defer th:src="@{/js/platform-confirm.js}"></script>
    <style>
        :root {
            --sales-primary: #0f766e;
            --sales-accent: #2563eb;
            --sales-bg: #f1f7f6;
            --sales-surface: #ffffff;
            --sales-ink: #102a2a;
        }
        body {
            background: var(--sales-bg);
            color: var(--sales-ink);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .sales-navbar {
            background: linear-gradient(135deg, var(--sales-primary), #155e75);
            box-shadow: 0 8px 24px rgba(15, 118, 110, 0.18);
        }
        .sales-navbar .navbar-brand {
            font-weight: 700;
            letter-spacing: 0;
        }
        .sales-navbar .nav-link {
            color: rgba(255, 255, 255, 0.82);
            border-radius: 8px;
            padding: 0.55rem 0.75rem;
        }
        .sales-navbar .nav-link:hover,
        .sales-navbar .nav-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.14);
        }
        .workspace-badge {
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            padding: 0.45rem 0.65rem;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }
        .page-header {
            background: var(--sales-surface);
            border-bottom: 1px solid #d8e9e6;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border: 1px solid #d8e9e6;
            border-radius: 8px;
            box-shadow: 0 8px 18px rgba(15, 118, 110, 0.07);
        }
        .card-header {
            background: #fff;
            border-bottom: 1px solid #d8e9e6;
            font-weight: 700;
        }
        .table thead th {
            background: var(--sales-primary) !important;
            color: #fff !important;
            border: none;
        }
        .btn-primary {
            background: var(--sales-primary);
            border-color: var(--sales-primary);
        }
        .btn-primary:hover {
            background: #115e59;
            border-color: #115e59;
        }
        .role-stat {
            border-left: 4px solid var(--sales-accent);
        }
    </style>
</head>
<body>
<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-dark sales-navbar sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/sales/dashboard">
            <i class="bi bi-headset me-2"></i>销售工作台
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#salesNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="salesNav">
            <ul class="navbar-nav me-auto gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'sales-dashboard' ? 'active' : ''}" href="/sales/dashboard">
                        <i class="bi bi-speedometer me-1"></i>今日工作
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'sales-products' ? 'active' : ''}" href="/sales/products">
                        <i class="bi bi-box-seam me-1"></i>商品维护
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'sales-orders' ? 'active' : ''}" href="/sales/orders">
                        <i class="bi bi-truck me-1"></i>订单处理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'sales-activities' ? 'active' : ''}" href="/sales/activities">
                        <i class="bi bi-activity me-1"></i>操作日志
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link text-light" href="/products"><i class="bi bi-shop me-1"></i>商城</a>
                <span class="workspace-badge"><i class="bi bi-person-badge"></i><span th:text="${username}">sales</span></span>
                <a href="/logout" class="text-light text-decoration-none"><i class="bi bi-box-arrow-right"></i></a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
